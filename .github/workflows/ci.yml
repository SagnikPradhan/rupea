name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: data/models
          key: models-${{ hashFiles('src/lib/server/shared/onnx/models.ts') }}
      - run: pnpm models
      - run: pnpm test:coverage
      - uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: unit
          parallel: true
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/lcov.info

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: data/models
          key: models-${{ hashFiles('src/lib/server/shared/onnx/models.ts') }}
      - run: pnpm models
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm test:e2e:coverage
      - if: ${{ !cancelled() }}
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/e2e/lcov.info
          flag-name: e2e
          parallel: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e
          path: coverage/e2e/lcov.info

  sonar:
    needs: [test, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coverage:
    needs: [test, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
