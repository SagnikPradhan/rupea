commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,svelte,astro,json,md,yml,yaml,css,html}'
      exclude: ['docs/manual/glossary.md', 'docs/manual/roadmap.md']
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint {staged_files}
    stylelint:
      glob: 'packages/web/src/**/*.svelte'
      run: pnpm exec stylelint {staged_files}
    harper:
      glob: '*.{ts,js,md}'
      exclude: ['packages/server/drizzle/**', '.agents/**', 'docs/manual/glossary.md']
      run: pnpm lint:prose {staged_files}
