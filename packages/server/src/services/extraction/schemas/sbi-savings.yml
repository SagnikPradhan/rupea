version: v1
name: State Bank of India savings account
match:
  - text: State Bank of India
account: Assets:Bank:SBI
header:
  text: Balance
fields:
  date: { from: [col: A], pipe: [date: dd/MM/yyyy] }
  description: { from: [col: C] }
  amount:
    - from: [col: E]
      pipe: [number, negate]
    - from: [col: F]
      pipe: [number]
  balance: { from: [col: G], pipe: [number] }
