sonar.organization=sagnikpradhan
sonar.projectKey=rupea

sonar.sources=packages/shared/src,packages/contract/src,packages/web/src,packages/server/src,packages/server/scripts,lint,packages/server/drizzle
sonar.exclusions=packages/*/src/**/tests/**,packages/server/drizzle/meta/**,packages/web/static/**,packages/web/build/**,packages/server/dist/**,coverage/**,packages/server/data/**

sonar.tests=packages/shared/tests,packages/contract/tests,packages/web/src,packages/web/tests,packages/server/src,packages/server/tests
sonar.test.inclusions=packages/*/tests/**,packages/*/src/**/tests/**

# Lists of merchant names, which only look alike.
sonar.cpd.exclusions=packages/*/tests/**,packages/*/src/**/tests/**,packages/server/src/**/domain/merchants.ts

# Table declarations, which the app only imports as types, and scripts
# run by hand.
sonar.coverage.exclusions=packages/server/src/**/database-schema.ts,packages/server/scripts/**
sonar.javascript.lcov.reportPaths=coverage/coverage-unit/lcov.info,coverage/coverage-unit/web/lcov.info,coverage/coverage-e2e/lcov.info

# Scripts run by hand read the folder they are given on purpose. Lint forbids
# throw in app code, so errors are returned as rejected promises.
sonar.issue.ignore.multicriteria=scripts,reject
sonar.issue.ignore.multicriteria.scripts.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.scripts.resourceKey=packages/server/scripts/**
sonar.issue.ignore.multicriteria.reject.ruleKey=typescript:S7746
sonar.issue.ignore.multicriteria.reject.resourceKey=packages/**
