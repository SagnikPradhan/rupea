sonar.organization=sagnikpradhan
sonar.projectKey=rupea

sonar.sources=src,packages/shared/src,packages/server/src,packages/server/scripts,lint,drizzle
sonar.exclusions=src/**/tests/**,packages/*/src/**/tests/**,drizzle/meta/**,static/**,build/**,coverage/**,data/**

sonar.tests=src,tests,packages/shared/tests,packages/server/src,packages/server/tests
sonar.test.inclusions=src/**/tests/**,tests/**,packages/*/tests/**,packages/*/src/**/tests/**

# Lists of merchant names, which only look alike.
sonar.cpd.exclusions=src/**/tests/**,tests/**,packages/*/tests/**,packages/*/src/**/tests/**,packages/server/src/**/domain/merchants.ts

# Table declarations, which the app only imports as types, and scripts
# run by hand.
sonar.coverage.exclusions=packages/server/src/**/database-schema.ts,packages/server/scripts/**
sonar.javascript.lcov.reportPaths=coverage/coverage-unit/lcov.info,coverage/coverage-e2e/lcov.info

# Scripts run by hand read the folder they are given on purpose.
sonar.issue.ignore.multicriteria=scripts
sonar.issue.ignore.multicriteria.scripts.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.scripts.resourceKey=packages/server/scripts/**
