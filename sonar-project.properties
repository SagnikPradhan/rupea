sonar.organization=sagnikpradhan
sonar.projectKey=rupea

sonar.sources=src,scripts,lint,drizzle
sonar.exclusions=src/**/tests/**,drizzle/meta/**,static/**,build/**,coverage/**,data/**

sonar.tests=src,tests
sonar.test.inclusions=src/**/tests/**,tests/**

# Lists of merchant names, which only look alike.
sonar.cpd.exclusions=src/**/tests/**,tests/**,src/**/domain/merchants.ts

# Table declarations, which the app only imports as types, and scripts
# run by hand.
sonar.coverage.exclusions=src/**/database-schema.ts,scripts/**
sonar.javascript.lcov.reportPaths=coverage/coverage-unit/lcov.info,coverage/coverage-e2e/lcov.info
