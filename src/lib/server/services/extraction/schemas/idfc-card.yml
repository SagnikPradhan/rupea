version: v1
name: IDFC FIRST Bank credit card
match:
  - text: '^Statement Date \d{2}/[A-Z][a-z]{2}/\d{4} to \d{2}/[A-Z][a-z]{2}/\d{4}$'
account: Liabilities:Card:IDFC
header:
  text: Details
records:
  each: row
  where: { col: Date, matches: '^\d{2}/\d{2}/\d{4}$' }
fields:
  date: { from: [header: Date], pipe: [date: dd/MM/yyyy] }
  description: { from: [header: Details] }
  amount:
    - from: [text: DR, left: 1]
      pipe: [number, negate]
    - from: [text: CR, left: 1]
      pipe: [number]
